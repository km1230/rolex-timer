[project]
name = "rolex-timer"
version = "1.0.0"
description = "A terminal-based time tracking tool"
requires-python = ">=3.7"
dependencies = [
    "click>=8.0.0",
    "simple-term-menu>=1.6.0",
]

[project.scripts]
rolex = "rolex:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["rolex.py", "timer.py", "storage.py", "models.py"]
